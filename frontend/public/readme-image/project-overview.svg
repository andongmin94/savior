<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">Savior 서비스 문제 해결 흐름</title>
  <desc id="description">흩어진 복지 정책과 복잡한 조건 탐색을 사용자 조건 기반 맞춤 추천으로 좁히고, 동일한 Axios 계약의 Mock 및 Real 실행 경계를 거쳐 검색과 관심 관리가 가능한 재현성 있는 경험으로 연결하는 3단 인포그래픽</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="1" stop-color="#0b2038"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#122a46" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#0c1e34" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity="0.32"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#background)"/>
  <circle cx="77" cy="42" r="100" fill="#2563eb" opacity="0.08"/>
  <circle cx="1135" cy="334" r="130" fill="#22d3ee" opacity="0.06"/>

  <path d="M380 180 H414" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M786 180 H820" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="34" y="34" width="346" height="292" rx="22" fill="url(#panel)" stroke="#294762"/>
    <rect x="427" y="34" width="359" height="292" rx="22" fill="url(#panel)" stroke="#294762"/>
    <rect x="820" y="34" width="346" height="292" rx="22" fill="url(#panel)" stroke="#294762"/>
  </g>

  <g font-family="Arial, 'Noto Sans KR', sans-serif">
    <g>
      <rect x="58" y="56" width="78" height="26" rx="13" fill="#1d4ed8" opacity="0.9"/>
      <text x="97" y="74" text-anchor="middle" font-size="12" font-weight="700" fill="#dbeafe">PROBLEM</text>
      <text x="58" y="111" font-size="22" font-weight="700" fill="#f8fafc">복잡한 정책 탐색</text>
      <text x="58" y="135" font-size="13" fill="#94a3b8">기관·대상·조건이 흩어진 정보</text>

      <g transform="translate(58 162)">
        <rect x="0" y="0" width="92" height="52" rx="10" fill="#172f4b" stroke="#3b5873"/>
        <circle cx="17" cy="17" r="6" fill="#60a5fa"/>
        <rect x="29" y="12" width="47" height="6" rx="3" fill="#64748b"/>
        <rect x="12" y="30" width="66" height="6" rx="3" fill="#334e68"/>
        <rect x="112" y="0" width="92" height="52" rx="10" fill="#172f4b" stroke="#3b5873"/>
        <circle cx="129" cy="17" r="6" fill="#22d3ee"/>
        <rect x="141" y="12" width="47" height="6" rx="3" fill="#64748b"/>
        <rect x="124" y="30" width="66" height="6" rx="3" fill="#334e68"/>
        <rect x="224" y="0" width="64" height="52" rx="10" fill="#172f4b" stroke="#3b5873"/>
        <path d="M241 14 h30 M241 25 h22 M241 36 h27" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
        <path d="M31 77 H257" stroke="#334e68" stroke-width="2" stroke-dasharray="4 6"/>
        <circle cx="78" cy="77" r="5" fill="#60a5fa"/>
        <circle cx="159" cy="77" r="5" fill="#22d3ee"/>
        <circle cx="240" cy="77" r="5" fill="#818cf8"/>
      </g>
      <text x="58" y="282" font-size="13" font-weight="700" fill="#cbd5e1">탐색 비용 증가 · 조건 비교의 어려움</text>
    </g>

    <g>
      <rect x="451" y="56" width="82" height="26" rx="13" fill="#0369a1" opacity="0.95"/>
      <text x="492" y="74" text-anchor="middle" font-size="12" font-weight="700" fill="#e0f2fe">BOUNDARY</text>
      <text x="451" y="111" font-size="22" font-weight="700" fill="#f8fafc">조건 기반 맞춤 추천</text>
      <text x="451" y="135" font-size="13" fill="#94a3b8">하나의 화면 · 하나의 요청 계약</text>

      <g transform="translate(452 159)">
        <rect x="0" y="18" width="78" height="64" rx="14" fill="#0f3652" stroke="#38bdf8"/>
        <circle cx="23" cy="41" r="11" fill="#38bdf8" opacity="0.22"/>
        <path d="M18 41 h10 M23 36 v10" stroke="#7dd3fc" stroke-width="2" stroke-linecap="round"/>
        <text x="42" y="46" font-size="13" font-weight="700" fill="#e0f2fe">조건</text>
        <text x="42" y="64" font-size="11" fill="#94a3b8">프로필</text>

        <path d="M84 50 H105" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>
        <rect x="112" y="18" width="84" height="64" rx="14" fill="#0c4a6e" stroke="#22d3ee"/>
        <text x="154" y="45" text-anchor="middle" font-size="13" font-weight="700" fill="#ecfeff">Axios</text>
        <text x="154" y="64" text-anchor="middle" font-size="11" fill="#a5f3fc">API 경계</text>

        <path d="M202 50 H218 V25 H232" stroke="#38bdf8" stroke-width="2" fill="none"/>
        <path d="M218 50 V75 H232" stroke="#38bdf8" stroke-width="2" fill="none"/>
        <rect x="232" y="2" width="72" height="45" rx="11" fill="#172f4b" stroke="#60a5fa"/>
        <text x="268" y="22" text-anchor="middle" font-size="12" font-weight="700" fill="#dbeafe">MOCK</text>
        <text x="268" y="37" text-anchor="middle" font-size="10" fill="#94a3b8">독립 실행</text>
        <rect x="232" y="55" width="72" height="45" rx="11" fill="#172f4b" stroke="#22d3ee"/>
        <text x="268" y="75" text-anchor="middle" font-size="12" font-weight="700" fill="#cffafe">REAL</text>
        <text x="268" y="90" text-anchor="middle" font-size="9" fill="#94a3b8">Spring·Django</text>
      </g>
      <rect x="451" y="279" width="311" height="25" rx="12" fill="url(#accent)" opacity="0.12"/>
      <text x="606" y="296" text-anchor="middle" font-size="12" font-weight="700" fill="#67e8f9">화면 변경 없이 데이터 공급자 전환</text>
    </g>

    <g>
      <rect x="844" y="56" width="82" height="26" rx="13" fill="#0e7490" opacity="0.95"/>
      <text x="885" y="74" text-anchor="middle" font-size="12" font-weight="700" fill="#ecfeff">OUTCOME</text>
      <text x="844" y="111" font-size="22" font-weight="700" fill="#f8fafc">탐색에서 관심 관리까지</text>
      <text x="844" y="135" font-size="13" fill="#94a3b8">검색·상세·저장 흐름의 연결</text>

      <g transform="translate(844 159)">
        <circle cx="29" cy="32" r="29" fill="#0f3652" stroke="#38bdf8"/>
        <circle cx="25" cy="28" r="10" fill="none" stroke="#7dd3fc" stroke-width="3"/>
        <path d="M33 36 l9 9" stroke="#7dd3fc" stroke-width="3" stroke-linecap="round"/>
        <path d="M65 32 H105" stroke="#334e68" stroke-width="2" marker-end="url(#arrow)"/>
        <circle cx="135" cy="32" r="29" fill="#0f3652" stroke="#22d3ee"/>
        <path d="M124 20 h22 v26 l-11-7-11 7z" fill="#67e8f9" opacity="0.9"/>
        <path d="M171 32 H211" stroke="#334e68" stroke-width="2" marker-end="url(#arrow)"/>
        <circle cx="241" cy="32" r="29" fill="#0f3652" stroke="#818cf8"/>
        <path d="M228 35 a14 14 0 1 0 3-13" fill="none" stroke="#a5b4fc" stroke-width="3" stroke-linecap="round"/>
        <path d="M227 15 l6 8-10 1" fill="none" stroke="#a5b4fc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="29" y="80" text-anchor="middle" font-size="11" font-weight="700" fill="#bae6fd">검색</text>
        <text x="135" y="80" text-anchor="middle" font-size="11" font-weight="700" fill="#a5f3fc">관심 관리</text>
        <text x="241" y="80" text-anchor="middle" font-size="11" font-weight="700" fill="#c7d2fe">상태 복원</text>
      </g>
      <rect x="844" y="279" width="298" height="25" rx="12" fill="#22d3ee" opacity="0.12"/>
      <text x="993" y="296" text-anchor="middle" font-size="12" font-weight="700" fill="#67e8f9">Web·Electron에서 재현 가능한 데모</text>
    </g>
  </g>
</svg>
